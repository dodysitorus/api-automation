name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types: [trigger-cucumber-tests] # Dipicu dari repo web statis

jobs:
  cucumber-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Install dependencies
        run: mvn clean install -DskipTests

      - name: Run Cucumber tests
        run: mvn test

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-results

  # 🚨 JOB 2: Pemicu Balik Deploy (Hanya jika Job 1 Sukses dan dipicu oleh dispatch)
  deploy-web-if-success:
    runs-on: ubuntu-latest
    needs: cucumber-test # Job ini bergantung pada keberhasilan job 'cucumber-test'

    # Kondisi Kunci: Sukses DAN pemicunya adalah 'repository_dispatch' (bukan push/pull_request internal)
    if: ${{ success() && github.event_name == 'repository_dispatch' }}

    steps:
      - name: Trigger Deploy in Web Statis Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          # Ganti dengan nama repository Web Statis Anda
          repository: dodysitorus/web-statis
          token: ${{ secrets.GH_TOKEN }} # PAT diperlukan
          # Nama event harus sama dengan yang ditunggu oleh Job Deploy di repo web
          event-type: deploy-web-after-success
          client-payload: {}