name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types: [trigger-cucumber-tests]

jobs:
  cucumber-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Install dependencies
        run: mvn clean install -DskipTests

      - name: Run Cucumber tests
        run: mvn test

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-results

  deploy-web-if-success:
    runs-on: ubuntu-latest
    needs: cucumber-test
    if: ${{ success() && github.event_name == 'repository_dispatch' }}

    steps:
      - name: Trigger Deploy in Web Statis Repo
        uses: peter-evans/repository-dispatch@v3
        with:
          repository: dodysitorus/web-statis
          token: ${{ secrets.GH_TOKEN }}
          event-type: deploy-web-after-success
          client-payload: {}