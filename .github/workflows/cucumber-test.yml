name: Run Cucumber Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  repository_dispatch:
    types: [trigger-cucumber-tests] # Dipicu dari repo web statis

jobs:
  cucumber-test:
    runs-on: ubuntu-latest

    # ... (Langkah 1 hingga 5 di atas tetap sama, tidak perlu diulang) ...
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          java-package: jdk
          architecture: x64
          check-latest: false

      - name: Install dependencies
        run: mvn clean install -DskipTests

      - name: Run Cucumber tests
        run: mvn test # ⚠️ Langkah ini akan menentukan keberhasilan job ini

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-results

  # --- Job Baru: Pemicu Balik Deploy ---
  deploy-web-if-success:
    runs-on: ubuntu-latest
    needs: cucumber-test # Job ini bergantung pada keberhasilan job 'cucumber-test'

    # 🚨 Kondisi Kunci: Hanya jalankan job ini jika 'cucumber-test' sukses.
    # Jika 'cucumber-test' gagal, job ini akan dilewati, dan deploy tidak akan terjadi.
    if: ${{ success() && github.event_name == 'repository_dispatch' }}

    steps:
      - name: Trigger Deploy in Web Statis Repo
        # Pastikan Anda menggunakan PAT (secrets.GH_TOKEN) yang memiliki
        # scope 'workflow' di repositori web statis
        uses: peter-evans/repository-dispatch@v3
        with:
          # Ganti 'nama-akun/web-statis' dengan path yang benar
          repository: dodysitorus/web-statis
          token: ${{ secrets.GH_TOKEN }} # PAT Anda
          # Gunakan event type yang disepakati untuk deploy
          event-type: deploy-web-after-success
          client-payload: {}